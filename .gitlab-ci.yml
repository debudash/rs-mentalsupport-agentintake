# GitLab CI — lint -> test (coverage gate) -> build -> deploy.
#
# Dormant until switched on: the instance has no shared runners, so jobs run on a project
# runner you register yourself (GitLab Runner in Docker Desktop, tag rs-assist-local).
# To enable: register the runner, then add CI/CD variable CI_ENABLED=true
# (Settings -> CI/CD -> Variables). Until then GitLab creates no pipelines at all.
# Deploy also needs a masked RAILWAY_TOKEN variable (Railway project token).

workflow:
  rules:
    - if: $CI_ENABLED == "true"

default:
  tags: [rs-assist-local]

stages: [lint, test, build, deploy]

variables:
  UV_CACHE_DIR: .uv-cache
  npm_config_cache: .npm-cache

.backend:
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv==0.13.1
    - cd backend
    - uv sync --frozen
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [backend/.uv-cache]

.frontend:
  image: node:22-slim
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [frontend/.npm-cache]

lint:backend:
  extends: .backend
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

lint:frontend:
  extends: .frontend
  stage: lint
  script:
    - npm run lint
    - npx tsc -b

test:backend:
  extends: .backend
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq tesseract-ocr libglib2.0-0 >/dev/null
    - uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=80
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report: { coverage_format: cobertura, path: backend/coverage.xml }

# Real Postgres: migrations apply cleanly and the double-booking guarantee holds when 20
# requests race for one slot (tests/test_postgres_concurrency.py).
test:postgres:
  extends: .backend
  stage: test
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
    TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
  script:
    - export FIELD_ENCRYPTION_KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
    - uv run alembic upgrade head
    - uv run pytest -m postgres -p no:cacheprovider -o addopts="" -rs

test:frontend:
  extends: .frontend
  stage: test
  script:
    - npm run test:coverage

build:image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    # Talk to the dind service without TLS (the runner is local and the network private).
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - docker build --target runtime -t rs-assist:$CI_COMMIT_SHORT_SHA .

deploy:railway:
  stage: deploy
  image: node:22-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RAILWAY_TOKEN
  script:
    - npm install -g @railway/cli
    - railway up --ci --detach
