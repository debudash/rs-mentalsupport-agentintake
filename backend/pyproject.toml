[project]
name = "rs-assist-backend"
version = "0.1.0"
description = "AI-powered onboarding assistant — API, Intake conductor, Document reader"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "cryptography>=43",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "anthropic>=0.70",
    "openai>=1.50",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pytesseract>=0.3.13",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "faker>=28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "postgres: needs a running Postgres (DATABASE_URL); skipped otherwise",
    "tesseract: needs the tesseract binary; skipped otherwise",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/seed.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
